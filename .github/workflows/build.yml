name: Build app and firmware
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HBRT-AGRO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HBRT-AGRO-app
          path: HBRT-AGRO.apk

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "ArduinoJson@7.4.3" "WebSockets@2.7.2" "DHT sensor library@1.4.7" "Adafruit Unified Sensor" \
            "OneWire@2.3.8" "DallasTemperature@4.0.6" "ESP32Servo@3.2.1" "U8g2@2.36.19"

      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --output-dir build firmware/hbrt_greenhouse
          cp build/hbrt_greenhouse.ino.bin hbrt_greenhouse.bin
          echo "FW=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/hbrt_greenhouse/hbrt_greenhouse.ino)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: hbrt_greenhouse-firmware
          path: hbrt_greenhouse.bin

      - name: Note the version
        run: echo "${{ env.FW }}" > fw_version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fw_version
          path: fw_version.txt

  release:
    # The board's "Update firmware" button downloads releases/latest/download/hbrt_greenhouse.bin
    needs: [app, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Read version
        run: echo "FW=$(cat out/fw_version.txt)" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FW }}
          name: HBRT AGRO ${{ env.FW }}
          make_latest: true
          body: |
            Firmware ${{ env.FW }} for the ESP32 (hbrt_greenhouse.bin) and the Android app (HBRT-AGRO.apk).
            Boards on firmware 6.0 or newer can install this from Settings → Board → Update firmware.
          files: |
            out/hbrt_greenhouse.bin
            out/HBRT-AGRO.apk
